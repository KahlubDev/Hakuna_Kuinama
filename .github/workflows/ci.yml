name: CI

# Audit finding R3: nothing stopped a red build reaching main. This workflow is the gate.
# It runs the three commands from docs/05-roadmap.md P0, plus a compile gate for the
# instrumentation suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # Uses the committed wrapper, so CI and a developer run byte-identical Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile the app and the instrumentation suite
        # assembleDebugAndroidTest is here as a compile gate, not as a test run. The
        # instrumentation sources had never compiled: room-testing was declared on
        # testImplementation, where androidTest cannot see it. Nothing caught it because
        # nothing built them. Compiling them on every push is what stops that recurring.
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Unit tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/index.html
            app/build/reports/tests/testDebugUnitTest/classes/*.html

  instrumented:
    name: Migration tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Enable KVM
        # Without this the emulator falls back to software rendering and either times out or
        # runs so slowly that the job is unusable.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable hardware acceleration for Gradle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14